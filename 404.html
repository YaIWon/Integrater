<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Integrator Pro</title>
    <meta http-equiv="refresh" content="0;url=./">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0a0e1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(13, 26, 42, 0.85);
            border-radius: 24px;
            border: 1px solid rgba(74, 158, 255, 0.15);
        }
        .icon { font-size: 4rem; display: block; margin-bottom: 16px; }
        h1 { color: #4a9eff; margin-bottom: 8px; }
        p { color: #8899aa; }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(74, 158, 255, 0.15);
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🔮</span>
        <h1>Universal Integrator Pro</h1>
        <p>Loading...</p>
        <div class="spinner"></div>
        <p style="margin-top: 16px; font-size: 0.8rem; color: #556677;">
            If you're not redirected automatically, 
            <a href="./" style="color: #4a9eff; text-decoration: none;">click here</a>
        </p>
    </div>
    <script>
        window.location.href = './';
    </script>
</body>
</html>
